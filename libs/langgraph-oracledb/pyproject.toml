[project]
name = "langgraph-oracledb"
version = "1.0.2"
description = "An integration package connecting Oracle Database and LangGraph"
readme = "README.md"
license = "UPL-1.0"
requires-python = ">=3.10,<4.0"
dependencies = [
    "langgraph-checkpoint>=2.1.2,<5.0.0",
    "orjson>=3.11.5",
    "oracledb>=2.2.0",
]

[project.urls]
"Source Code" = "https://github.com/oracle/langchain-oracle/tree/main/libs/langgraph-oracledb"
Repository = "https://github.com/oracle/langchain-oracle"

[tool.poetry]
package-mode = true

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
anyio = "^4.14.2"
# pytest-asyncio 0.23 cannot collect under pytest 9 ("'Package' object has no
# attribute 'obj'"), which broke the release workflow's `make tests`.
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.15.0"
pytest-dotenv = "^0.5.2"
python-dotenv = "^1.0.0"
oracledb = ">=2.2.0"
langgraph-checkpoint = ">=4.1.1,<5.0.0"
pytest-watcher = "^0.3.4"
pytest-cov = "^4.1.0"

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.6"

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.13.1"

[tool.poetry.group.typing.dependencies]
mypy = "^1.7"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]

[tool.ruff]
exclude = [
  "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
]
ignore = [
  "E501",
  "B008",
  "COM812",  # Messes with the formatter
]
exclude = [
  "tests",
]

[tool.mypy]
check_untyped_defs = true
error_summary = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
disable_error_code = "typeddict-item, return-value"
# langgraph_oracledb/, checkpoint/ and store/ are namespace packages; resolve
# modules from the project root so checkpoint.oracle and store.oracle differ.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "oracledb.*",
]
ignore_missing_imports = true

# Tests lean on dynamic patterns mypy can't follow cheaply: monkeypatched
# methods (method-assign), fixtures re-exported from conftest_checkpointer
# (attr-defined), loosely typed fixture data/generators (arg-type, index,
# call-overload, union-attr, operator, assignment, var-annotated), fake
# connection subclasses (override) and intentionally unreachable asserts.
[[tool.mypy.overrides]]
module = ["tests.*"]
warn_unused_ignores = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "index",
    "method-assign",
    "operator",
    "override",
    "union-attr",
    "unreachable",
    "var-annotated",
]

[tool.coverage.run]
omit = ["tests/*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# --strict-markers will raise errors on unknown marks.
# https://docs.pytest.org/en/7.1.x/how-to/mark.html#raising-errors-on-unknown-marks
#
# https://docs.pytest.org/en/7.1.x/reference/reference.html
# --strict-config       any warnings encountered while parsing the `pytest`
#                       section of the configuration file raise errors.
addopts = "--strict-markers --strict-config --durations=5 --cov=langgraph_oracledb"
# Registering custom markers.
# https://docs.pytest.org/en/7.1.x/example/markers.html#registering-markers
markers = [
  "requires: mark tests as requiring a specific library",
  "asyncio: mark tests as requiring asyncio",
  "compile: mark tests as import/compile checks",
  "scheduled: mark tests to run in scheduled testing",
]
asyncio_mode = "auto"
