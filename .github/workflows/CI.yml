---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Allows manual triggering from GitHub UI

permissions:
  contents: read

# If another push to the same PR or branch happens while this workflow is still running,
# cancel the earlier run in favor of the next run.
#
# There's no point in testing an outdated version of the code. GitHub only allows
# a limited number of job runners to be active at the same time, so it's better to cancel
# pointless jobs early so that more useful jobs can run sooner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"

jobs:
  lint:
    name: cd ${{ matrix.working-directory }}
    strategy:
      matrix:
        working-directory:
          - "libs/oci"
          - "libs/oracledb"
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: ${{ matrix.working-directory }}
    secrets: inherit

  test:
    name: cd ${{ matrix.working-directory }}
    strategy:
      matrix:
        working-directory:
          - "libs/oci"
          - "libs/oracledb"
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: ${{ matrix.working-directory }}
    secrets: inherit

  js_oci:
    # This package is standalone (not part of the Python Poetry matrix), so it
    # needs an explicit CI job for its TypeScript checks.
    name: "libs/js/oci"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/js/oci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node.js 22.13+ (and relies on node:sqlite).
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint, test, and build
        run: pnpm lint && pnpm test && pnpm build

  ci_success:
    name: "CI Success"
    needs: [lint, test, js_oci]
    if: |
      always()
    runs-on: ubuntu-latest
    env:
      JOBS_JSON: ${{ toJSON(needs) }}
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
      EXIT_CODE: ${{!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && '0' || '1'}}
    steps:
      - name: "CI Success"
        run: |
          echo $JOBS_JSON
          echo $RESULTS_JSON
          echo "Exiting with $EXIT_CODE"
          exit $EXIT_CODE
